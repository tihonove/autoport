name: CI

# Проверка на пуш в main и на PR. Кросс-сборка здесь же: пакет чистый stdlib,
# CGO не нужен, поэтому обе архитектуры собираются на обычном ubuntu-раннере.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "не отформатировано:"; echo "$unformatted"; exit 1
          fi

      - run: go vet ./...

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Сборка под ${{ matrix.goarch }}
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -o "autoport-${{ matrix.goarch }}" ./cmd/autoport
